{% load socialaccount %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome Back</title>
  <!-- Lucide Icons & Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-[#0b101b] min-h-screen flex items-center justify-center p-4 selection:bg-blue-500 selection:text-white">

  <!-- Modal Card -->
  <div class="w-full max-w-md bg-[#111827]/70 backdrop-blur-xl border border-white/5 rounded-3xl p-8 sm:p-10 shadow-2xl flex flex-col items-center text-center">
    
    <!-- Top Glowing Shield Icon -->
    <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center shadow-lg shadow-indigo-500/25 mb-6">
      <i data-lucide="shield" class="w-7 h-7 text-white stroke-[2.2]"></i>
    </div>

    <!-- Title & Subtitle -->
    <h1 class="text-3xl font-bold tracking-tight text-white mb-2">Welcome Back</h1>
    <p class="text-sm text-slate-400 mb-8 font-normal">Select your OAuth provider to continue</p>

    <!-- Provider Buttons -->
    <div class="w-full space-y-3.5">
      
      <!-- Google -->
      <form action="{% provider_login_url 'google' %}" method="post">
        {% csrf_token %}
        <button type="submit" class="w-full flex items-center justify-center gap-3 py-3.5 px-4 rounded-xl font-medium text-slate-800 bg-white hover:bg-slate-100 transition duration-150 shadow-sm active:scale-[0.99]">
          <svg class="w-5 h-5" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.8-2.4 3.66v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.15z"/>
            <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24z"/>
            <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.99 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/>
            <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
          </svg>
          <span>Continue with Google</span>
        </button>
      </form>

      <!-- GitHub -->
      <form action="{% provider_login_url 'github' %}" method="post">
        {% csrf_token %}
        <button type="submit" class="w-full flex items-center justify-center gap-3 py-3.5 px-4 rounded-xl font-medium text-white bg-[#24292e] hover:bg-[#2b3137] transition duration-150 shadow-sm active:scale-[0.99]">
          <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
            <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
          </svg>
          <span>Continue with GitHub</span>
        </button>
      </form>

      <!-- Facebook -->
      <form action="{% provider_login_url 'facebook' %}" method="post">
        {% csrf_token %}
        <button type="submit" class="w-full flex items-center justify-center gap-3 py-3.5 px-4 rounded-xl font-medium text-white bg-[#1877F2] hover:bg-[#166fe5] transition duration-150 shadow-sm active:scale-[0.99]">
          <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
            <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
          </svg>
          <span>Continue with Facebook</span>
        </button>
      </form>

    </div>

    <!-- Divider & Bottom Caption -->
    <div class="w-full border-t border-white/5 my-8"></div>
    <p class="text-xs text-slate-500 font-medium tracking-wide">
      Protected by Django • OAuth 2.0 Encrypted
    </p>

  </div>

  <script>
    lucide.createIcons();
  </script>
</body>
</html>
